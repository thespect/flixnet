    <script src="./hls.min.js"></script>

    <!-- SDK Oficial de Google Cast (Chromecast / Google TV / Android TV para PC, Celular y Tablet) -->
    <script>
      window['__onGCastApiAvailable'] = function(isAvailable) {
        if (isAvailable && window.cast && window.cast.framework) {
          try {
            const context = window.cast.framework.CastContext.getInstance();
            context.setOptions({
              receiverApplicationId: window.chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
              autoJoinPolicy: window.chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            window.__CINEFLEX_CAST_READY__ = true;
          } catch (e) {}
        }
      };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async defer></script>

    <!-- Escudo Total Anti-Redirección, Anti-Popups y Anti-Anuncios -->
    <script>
      (function() {
        window.__cineflexOrigin = window.location.origin;

        // 1. Neutralizar window.open no solicitado (popups / popunders), permitiendo Cast y enlaces locales
        const originalOpen = window.open;
        window.open = function(url, target, features) {
          if (
            url &&
            typeof url === 'string' &&
            (url.startsWith(window.location.origin) ||
              url.includes('?watch=') ||
              url.startsWith('wvc-x-callback:') ||
              url.startsWith('vlc:') ||
              url.startsWith('intent:') ||
              /^https?:\/\/(192\.168\.|10\.|172\.)/.test(url))
          ) {
            return originalOpen.call(window, url, target, features);
          }
          console.info('[Cineflex AdGuard] Ventana emergente bloqueada:', url);
          return null;
        };

        // 2. Bloquear desvío de navegación provocado por iframes externos
        window.addEventListener('beforeunload', function(e) {
          if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            e.preventDefault();
            e.returnValue = '';
            return '';
          }
        });
      })();
    </script>
