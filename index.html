<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E50914'><path d='M4 2v20l16-10L4 2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineflex • Películas y Series en 4K</title>

    <!-- Escudo Anti-Publicidad Nativo: Neutraliza window.open y popups externos -->
    <script>
      (function() {
        // Bloqueo estricto de window.open (popups, popunders)
        window.open = function(url, target, features) {
          console.warn('[Cineflex Ad-Shield] Ventana emergente o popup publicitario bloqueado:', url);
          return null;
        };

        // Si una ventana intenta robar el foco, mantenerla en la app
        window.addEventListener('blur', function() {
          setTimeout(function() { window.focus(); }, 100);
        });

        // Intercepta clics en enlaces target="_blank" no autorizados
        document.addEventListener('click', function(e) {
          const a = e.target.closest('a');
          if (a && a.target === '_blank' && !a.classList.contains('allow-external')) {
            e.preventDefault();
            e.stopPropagation();
            console.warn('[Cineflex Ad-Shield] Enlace de publicidad neutralizado:', a.href);
          }
        }, true);
      })();
    </script>

    <!-- Preconnect to image CDN and Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
